baseURL = 'https://fksvs.github.io/'
locale = 'en-us'
title = 'Fatih Koçer'
theme = 'hugo-xmin'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
    showShareIcons = false

[params.author]
    name = "Fatih Koçer"
    avatar = "lara.jpg"
    github = "fksvs"
    gitlab = "fksvs"
    linkedin = "fatihkocerc"
    reddit = "fksvsc"

# Defining [taxonomies] replaces Hugo's defaults, so tags must be listed
# explicitly alongside categories.
# https://gohugo.io/content-management/taxonomies/#default-taxonomies
[taxonomies]
    category = "categories"
    tag = "tags"

# pageRef (instead of url) lets Hugo resolve the page and mark the active item.
# https://gohugo.io/content-management/menus/#define-in-site-configuration
# First entry is the site name; custom.css pushes it to the left of the menu.
[[menus.main]]
    name = "Fatih Koçer"
    pageRef = "/"
    weight = 1
[[menus.main]]
    name = "Posts"
    identifier = "posts"
    pageRef = "/posts"
    weight = 2
[[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 3
[[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 4
[[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 5

[[menus.footer]]
    name = "About"
    pageRef = "/about"
    weight = 1
